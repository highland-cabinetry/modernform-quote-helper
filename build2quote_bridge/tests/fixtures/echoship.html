<div id="ltl-quote-origin-entry"><div class="location-card">Origin 80011</div></div>
<main><form>
  <div id="ltl-quote-destination-entry"><label>Destination ZIP<input aria-controls="echo-postal-options" name="locationTypeaheadDestination" placeholder="Search by ZIP or Saved Location"></label></div>
  <div id="echo-postal-options"><button type="button" role="option">59714 Belgrade MT</button></div>
  <section class="commodity">
    <label>Quantity<input id="home-ship-quan-3" name="quantity"></label>
    <label>Handling Unit<select id="home-ship-handling-3" name="handlingUnit"><option value="9: 2">Skids</option></select></label>
    <label>Total Weight<input id="home-ship-weight-3" name="weight"></label>
    <label>Length<input id="home-ship-length-3" name="length"></label>
    <label>Width<input id="home-ship-width-3" name="width"></label>
    <label>Height<input id="home-ship-height-3" name="height"></label>
    <label>Description<input name="description" placeholder="Enter item description or search saved items"></label>
    <label>Freight Class<select id="home-ship-freight-3" name="freightClass"><option value="10: 10">70</option><option value="11: 11">85</option><option value="12: 12">92.5</option><option value="13: 13">175</option><option value="15: 15">250</option></select></label>
    <label>NMFC<input id="home-ship-nmfc-3" name="nmfc"></label>
    <label>Do Not Stack<input type="checkbox" name="doNotStack"></label>
  </section>
  <button type="button" id="add-new-quote-item-btn">Add Another Item</button>
  <button type="button" id="da-dropdown">Delivery Accessorials</button>
  <label id="ltl-quote-destination-liftgate">Lift-Gate Delivery Required<input type="checkbox" name="liftgate"></label>
  <select id="locationType">
    <option id="ltl-quote-destination-business" value="1">Business</option>
    <option id="ltl-quote-destination-residential" value="2">Residential</option>
  </select>
  <button type="button" id="submit-new-quote-btn">Get Quotes</button>
</form></main>
