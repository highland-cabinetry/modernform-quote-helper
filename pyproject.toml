[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modernform-quote-helper"
version = "1.0.1"
description = "Modernform Quote Helper: pallet planning and broker autofill for cabinet freight quotes"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1.5,<4",
  "pdfplumber>=0.11.7,<1",
  "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
